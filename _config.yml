# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Nikita Koval | Welcome to my website"
title_separator: "-"
name: "Nikita Koval"
#description: "Nikita Koval | Personal website"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://nikitakoval.org" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: nkoval_
repository: "ndkoval/ndkoval.github.io"
# Build settings
markdown: kramdown
# Theme is pinned via the minimal-mistakes-jekyll gem (see Gemfile) so that
# local and CI builds are identical and reproducible.
theme: minimal-mistakes-jekyll
# The theme's bundled Sass predates Dart Sass and emits deprecation warnings.
# quiet_deps silences warnings from imported (theme) stylesheets while still
# reporting any in this site's own Sass. The theme is loaded via @import (it
# has no @use-based entrypoint), so the import deprecation is silenced too.
sass:
  quiet_deps: true
  silence_deprecations:
    - import
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-archives
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji

minimal_mistakes_skin: "air"
search: false
atom_feed:
  hide: true

